name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.1

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v0.1.1' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore .\FlowGPTBridge.sln

      - name: Test
        run: dotnet test .\FlowGPTBridge.sln -c Release --no-restore

      - name: Publish plugin
        run: dotnet publish .\FlowGPTBridge\FlowGPTBridge.csproj -c Release --no-restore -o .\artifacts\FlowGPTBridge

      - name: Package plugin
        id: package
        shell: pwsh
        run: |
          $assetName = "FlowGPTBridge-$env:RELEASE_TAG.zip"
          $assetPath = Join-Path $PWD "artifacts\$assetName"
          Compress-Archive -Path ".\artifacts\FlowGPTBridge\*" -DestinationPath $assetPath -Force
          $hash = (Get-FileHash -Algorithm SHA256 $assetPath).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -Encoding ascii ".\artifacts\$assetName.sha256"
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $assetName = "${{ steps.package.outputs.asset_name }}"
          $assetPath = ".\artifacts\$assetName"
          $checksumPath = "$assetPath.sha256"
          $notes = @"
          FlowGPT Bridge v0.1.1 修复版本。

          修复内容：
          - 修正 `GetCurrentThreadId` 的 Win32 DLL 导入；
          - 解决窗口激活阶段的 `EntryPointNotFoundException`；
          - 恢复模式切换和新建聊天快捷键发送；
          - 增加原生入口映射回归测试。

          安装：
          1. 下载并解压 $assetName。
          2. 将解压后的全部文件放入 Flow Launcher 用户数据目录下的 `Plugins\FlowGPTBridge`。
          3. 重启 Flow Launcher，输入 `gpt` 测试。
          4. 首次使用前，请确认插件快捷键与 ChatGPT 桌面端快捷键一致。

          请先退出 Flow Launcher，再使用本版本文件覆盖旧插件目录并重启。
          "@

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assetPath $checksumPath --clobber
            gh release edit $tag --title "FlowGPT Bridge $tag" --notes $notes --latest
          }
          else {
            gh release create $tag $assetPath $checksumPath --target "${{ github.sha }}" --title "FlowGPT Bridge $tag" --notes $notes --latest
          }
